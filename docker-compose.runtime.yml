services:
  lottie:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: lottie-codeagent-runtime:latest
    working_dir: /workspace/repo
    environment:
      PYTHONUNBUFFERED: "1"
      MSWEA_GLOBAL_CONFIG_DIR: /workspace/repo/.mswea
      MSWEA_SILENT_STARTUP: "1"
    volumes:
      - ./:/workspace/repo
    entrypoint: ["codeagent"]
    command: ["--help"]
