[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lotie-code-agent"
version = "0.1.0"
description = "LoTie: a code-agent runtime and data pipeline for trajectory collection, SFT, and verifier-driven evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "mini-swe-agent>=2.4.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
analysis = [
  "Pillow>=10.0",
]
swegym = [
  "datasets>=2.20",
  "huggingface-hub>=0.23",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "tqdm>=4.66",
]
local-llm = [
  "accelerate>=0.33",
  "safetensors>=0.4",
  "transformers>=4.54",
]
full = [
  "lotie-code-agent[analysis,dev,swegym,local-llm]",
]

[project.scripts]
lotie = "code_agent_baseline.cli:main"
codeagent = "code_agent_baseline.cli:main"
minicoder = "code_agent_baseline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
