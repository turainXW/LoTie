[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lottie-sao-value"
version = "0.1.0"
description = "Auditable terminal-return value-model cold start for SAO"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.3.5",
  "peft==0.20.0",
  "safetensors==0.8.0",
  "torch==2.13.0",
  "transformers==5.10.4",
]

[project.optional-dependencies]
test = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
